[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpfwire"
version = "0.6.0.dev0"
requires-python = ">=3.10"
description = "Turn network captures into Zipline Payload Format (.zpf) files"
authors = [ { name = "Adam Jonsson", email = "akj426@gmail.com" } ]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# Ranges, each closed above (#41).  Both siblings are in 0.x and say in their
# own changelogs that a minor may break with no upgrade path promised, so a
# range spanning a minor this tree was never run against is a promise neither
# project can keep.  The ceiling moves deliberately, at each sibling release,
# once the suite has passed against it; it is not to be widened in tidying.
#
# zpf is one minor wide.  0.7.0 writes the same spec as 0.6.0 (0.23), so the
# floor moving to it costs no reader anything; 0.6.0 was the first release
# implementing 0.23, and refuses a 0.21 file outright, which is what an
# unbounded pin would have done to this tree's users at the next spec port.
#
# packeteer's floor names what the suite needs, not only the code: 0.16.0's
# generator no longer acknowledges past a corrupted segment before its resend
# (packeteer#163), which the generated favor-acked test depends on (#30).
# The code itself needs nothing newer.  Its ceiling is the next minor above
# 0.20.0, the release this tree is built and tested against.
#
# Neither sibling is on PyPI: requirements.txt installs the exact releases
# from their tags, and tests/test_package.py holds those tags inside these
# ranges.
dependencies = [
    "packeteer>=0.16.0,<0.21",
    "zpf>=0.7.0,<0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zpfwire*"]

[tool.setuptools.package-data]
"zpfwire" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
zpfwire = "zpfwire.__main__:main"

[project.urls]
Repository = "https://github.com/adamkjonsson/python-zipline-wire.git"
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.23/docs/zipline-payload-format.md"
