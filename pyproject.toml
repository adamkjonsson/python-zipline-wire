[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpfwire"
version = "0.1.0"
requires-python = ">=3.11"
description = "Turn network captures into Zipline Payload Format (.zpf) files"
authors = [ { name = "Adam Jonsson", email = "akj426@gmail.com" } ]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# Floors, not ranges: neither sibling is on PyPI, so these document what this
# release was built against as much as they resolve anything.  Both are
# required — 0.1.0 writes spec 0.19, which zpf 0.2.0 refuses at the version
# gate, and reads packeteer's truncation and loopback support.
dependencies = [
    "packeteer>=0.12.0",
    "zpf>=0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zpfwire*"]

[tool.setuptools.package-data]
"zpfwire" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
zpfwire = "zpfwire.__main__:main"

[project.urls]
Repository = "https://github.com/adamkjonsson/python-zipline-wire.git"
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.19/docs/zipline-payload-format.md"
