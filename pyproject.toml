[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpfwire"
version = "0.1.0"
requires-python = ">=3.11"
description = "Turn network captures into Zipline Payload Format (.zpf) files"
authors = [ { name = "Adam Jonsson", email = "akj426@gmail.com" } ]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "packeteer",
    "zpf",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zpfwire*"]

[tool.setuptools.package-data]
"zpfwire" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
zpfwire = "zpfwire.__main__:main"

[project.urls]
Repository = "https://github.com/adamkjonsson/python-zipline-wire.git"
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.16/docs/zipline-payload-format.md"
