[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpfwire"
version = "0.8.0"
requires-python = ">=3.10"
description = "Turn network captures into Zipline Payload Format (.zpf) files"
authors = [ { name = "Adam Jonsson", email = "akj426@gmail.com" } ]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# Each sibling by its release tag, never by name alone (#67).  Neither is on
# PyPI, and both names are taken there by unrelated projects, so a declaration
# by name and range is resolved against PyPI: anyone who uploads a version
# inside the range is installed by a plain `pip install zpfwire`.  A direct
# reference is never looked up on an index.
#
# What it costs: a range.  Each release names the one tag it was built and
# tested against, so a sibling's patch release is taken in by a zpfwire
# release, as its minor releases already were (#41).  PyPI refuses to host a
# package declaring direct references, which none of the three is.
#
# This is where the tags are named, and the only place: `pip install -e .`
# installs them, requirements.txt does not repeat them, and
# tests/test_package.py holds the form.  python-zipline took a PyPI-safe
# distribution name of its own in 0.8.0, `python-zipline`, importing as `zpf`
# still (python-zipline#102); packeteer has yet to (packeteer#231).  Neither is
# on PyPI, so both stay declared by tag; a sibling that is published under a
# safe name can become a range again.
dependencies = [
    "packeteer @ git+https://github.com/adamkjonsson/packeteer.git@v0.21.0",
    "python-zipline @ git+https://github.com/adamkjonsson/python-zipline.git@v0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zpfwire*"]

[tool.setuptools.package-data]
"zpfwire" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[project.scripts]
zpfwire = "zpfwire.__main__:main"

[project.urls]
Repository = "https://github.com/adamkjonsson/python-zipline-wire.git"
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.24/docs/zipline-payload-format.md"
