name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The two siblings are not published to PyPI.  requirements.txt installs them
# from the release tags this tree is built against, so CI tests the releases
# the wheel declares, not whatever the siblings' default branches hold (#42).
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: python-zipline-wire
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: python-zipline-wire
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: Lint with ruff
        working-directory: python-zipline-wire
        run: ruff check src/ tests/ docs/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          path: python-zipline-wire
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: python-zipline-wire
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: Run tests
        working-directory: python-zipline-wire
        run: pytest

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: python-zipline-wire
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: python-zipline-wire
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      # -W turns warnings into errors, so a broken cross-reference or an
      # autodoc target that no longer exists fails the build.
      - name: Build the documentation
        working-directory: python-zipline-wire
        run: sphinx-build -W docs docs/_build/html
